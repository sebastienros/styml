<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Styml</title>
  <desc id="desc">A white YAML key with its colon above an indented two-item dash list, with a cyan indentation guide, on a rounded violet-to-blue tile.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset=".55" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1E1B4B" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#background)"/>
  <rect width="512" height="512" rx="112" fill="url(#gloss)"/>
  <path d="M136 226V382" stroke="#A5F3FC" stroke-width="10" stroke-linecap="round"/>
  <circle cx="136" cy="226" r="10" fill="#A5F3FC"/>
  <circle cx="136" cy="382" r="10" fill="#A5F3FC"/>
  <g filter="url(#shadow)">
    <g stroke="#FFFFFF" stroke-width="28" stroke-linecap="round">
      <path d="M112 148H272"/>
    </g>
    <circle cx="318" cy="128" r="15" fill="#FFFFFF"/>
    <circle cx="318" cy="168" r="15" fill="#FFFFFF"/>
    <g stroke="#FFFFFF" stroke-width="24" stroke-linecap="round">
      <path d="M180 262H212"/>
      <path d="M252 262H400"/>
      <path d="M180 346H212"/>
      <path d="M252 346H364"/>
    </g>
  </g>
</svg>
