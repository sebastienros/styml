name: Build

permissions:
  contents: read

on:
  workflow_dispatch:

  push:
    branches: [ main ]
    paths-ignore:
    - 'docs/**'
    - 'README.md'

  pull_request:
    branches: [ main ]
    paths-ignore:
    - 'docs/**'
    - 'README.md'

# A new push to a pull request cancels its running checks. Other runs each have their own group, so that every run on
# main finishes and pushes its preview packages.
concurrency:
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  RESTORE_SOURCES: --source https://api.nuget.org/v3/index.json --source https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-eng/nuget/v3/index.json
  # The properties of every build, restore and pack, so that the legs' builds are incremental and the packages keep them.
  BUILD_PROPS: -p:VersionSuffix=preview.${{ github.run_number }} -p:ContinuousIntegrationBuild=True

jobs:
  # The whole solution, every target framework (a framework no leg runs still compiles), and the packages.
  package:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
    - name: Check the upstream record
      run: python3 -I eng/upstream/upstream.py check
    - uses: ./.github/actions/prepare
    - name: Build
      run: dotnet build Styml.slnx --configuration Release --no-restore $BUILD_PROPS

    # Pack on every run so a missing target asset fails the pull request, not only main or a release tag.
    - name: Pack preview packages
      run: dotnet pack src/Styml/Styml.csproj --output artifacts/packages --configuration Release --no-build $BUILD_PROPS

    # The consumer sample, restored from the packed package as a consumer would.
    - name: Consumer sample from the package
      shell: bash
      run: |
        set -euo pipefail
        version="$(dotnet msbuild src/Styml/Styml.csproj -getProperty:PackageVersion $BUILD_PROPS)"
        # The sample's project adds artifacts/packages to the restore sources.
        dotnet restore samples/RoundTrip $RESTORE_SOURCES -p:NoWarn=NU1507 -p:StymlPackageVersion="$version"
        for tfm in net11.0 net10.0; do
          dotnet run --project samples/RoundTrip -c Release -f "$tfm" --no-restore -p:StymlPackageVersion="$version"
        done

    # On every run, so that a pull request exercises what the push job downloads (the .nupkg and its .snupkg).
    - name: Upload preview packages
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: packages
        path: artifacts/packages/
        if-no-files-found: error
        retention-days: 7

  # One job per leg, in parallel; each builds its test projects for its framework only (eng/test/run-tests.sh).
  # Leg Y: the writer's block default, upstream's filter (category!=OuterLoop&category!=failing) and
  # category!=jsonoutput. Leg YJ: the JSON-compatible writer default (STYML_TEST_WRITER=json), every test.
  # net481: the .NET Framework runtime, bound to the netstandard2.0 asset.
  test:
    name: test (${{ matrix.os }}, ${{ matrix.leg }}, ${{ matrix.tfm }})

    strategy:
      fail-fast: false
      matrix:
        include:
        - { os: ubuntu-latest, leg: Y, tfm: net11.0 }
        - { os: ubuntu-latest, leg: YJ, tfm: net11.0, writer: json }
        - { os: windows-latest, leg: Y, tfm: net11.0 }
        - { os: windows-latest, leg: YJ, tfm: net11.0, writer: json }
        - { os: windows-latest, leg: Y, tfm: net481, projects: test/Styml.Yaml.Tests/Styml.Yaml.Tests.csproj }

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
    - uses: ./.github/actions/prepare
    - name: Test, leg ${{ matrix.leg }} (${{ matrix.tfm }})
      shell: bash
      env:
        STYML_BUILD_ARGS: ${{ env.BUILD_PROPS }}
        STYML_TEST_WRITER: ${{ matrix.writer }}
        PROJECTS: ${{ matrix.projects || 'test/Styml.Tests/Styml.Tests.csproj test/Styml.SourceGeneration.Tests/Styml.SourceGeneration.Tests.csproj test/Styml.SourceGeneration.Unit.Tests/Styml.SourceGeneration.Unit.Tests.csproj test/Styml.Yaml.Tests/Styml.Yaml.Tests.csproj test/Styml.Parity.Tests/Styml.Parity.Tests.csproj' }}
      run: eng/test/run-tests.sh ${{ matrix.tfm }} $PROJECTS
    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: testresults-${{ matrix.os }}-${{ matrix.leg }}-${{ matrix.tfm }}
        path: |
          artifacts/testresults/
          artifacts/testresults-yj/
        if-no-files-found: ignore
        retention-days: 7

  # From main only, once the packages are built and every leg passed.
  push:
    needs: [ package, test ]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        dotnet-version: 10.0.x
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: packages
        path: artifacts/packages
    - name: Push preview packages to Feedz
      shell: bash
      env:
        FEEDZ_IO_API_KEY: ${{ secrets.FEEDZ_IO_API_KEY }}
      run: |
        set -euo pipefail
        if [[ -z "$FEEDZ_IO_API_KEY" ]]; then
          echo "Feedz publishing skipped: FEEDZ_IO_API_KEY is not configured."
          exit 0
        fi
        for package in artifacts/packages/*.nupkg; do
          dotnet nuget push "$package" --api-key "$FEEDZ_IO_API_KEY" --source https://f.feedz.io/sebastienros/styml/nuget/index.json --skip-duplicate
        done
