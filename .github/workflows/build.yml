name: Build

permissions:
  contents: read

on:
  workflow_dispatch:

  push:
    branches: [ main ]
    paths-ignore:
    - 'docs/**'
    - 'README.md'

  pull_request:
    branches: [ main ]
    paths-ignore:
    - 'docs/**'
    - 'README.md'

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    runs-on: ${{ matrix.os }}
    env:
        DOTNET_NOLOGO: true
        DOTNET_CLI_TELEMETRY_OPTOUT: 1
        NUGET_PACKAGES: ${{ matrix.os == 'ubuntu-latest' && '/mnt/nuget/packages' || format('{0}/.nuget/packages', github.workspace) }}
        NUGET_HTTP_CACHE_PATH: ${{ github.workspace }}/.nuget/http-cache
        NUGET_SCRATCH: ${{ github.workspace }}/.nuget/scratch
        NUGET_PLUGINS_CACHE_PATH: ${{ github.workspace }}/.nuget/plugins
        # The test projects use three Microsoft.DotNet.* packages that only dnceng's public dotnet-eng feed serves.
        # The repository has no NuGet.config; CI names both sources on the restore command line, and silences NU1507
        # (two sources without package source mapping), which only a NuGet.config could resolve.
        RESTORE_SOURCES: --source https://api.nuget.org/v3/index.json --source https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-eng/nuget/v3/index.json

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
    - name: Check the upstream record
      if: runner.os == 'Linux'
      run: python3 -I eng/upstream/upstream.py check
    - name: Prepare Linux NuGet package directory
      if: runner.os == 'Linux'
      shell: bash
      run: sudo install -d -o "$(id -u)" -g "$(id -g)" "$NUGET_PACKAGES"
    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        dotnet-version: |
          10.0.x
        global-json-file: global.json
        check-latest: false
    - name: Restore
      shell: bash
      run: dotnet restore Styml.slnx $RESTORE_SOURCES -p:NoWarn=NU1507 -p:Configuration=Release -p:VersionSuffix=preview.${{ github.run_number }} -p:ContinuousIntegrationBuild=True
    - name: Build
      run: dotnet build Styml.slnx --configuration Release --no-restore -p:VersionSuffix=preview.${{ github.run_number }} -p:ContinuousIntegrationBuild=True

    # Leg Y: the writer's block default, upstream's filter (category!=OuterLoop&category!=failing) and
    # category!=jsonoutput. Leg YJ: the JSON-compatible writer default (STYML_TEST_WRITER=json), every test.
    # eng/test/run-tests.sh builds each project for the framework (incremental here) and fails the leg on any failure.
    - name: Test, leg Y (net11.0)
      shell: bash
      env:
        STYML_BUILD_ARGS: -p:VersionSuffix=preview.${{ github.run_number }} -p:ContinuousIntegrationBuild=True
      run: eng/test/run-tests.sh net11.0 test/Styml.Tests/Styml.Tests.csproj test/Styml.SourceGeneration.Tests/Styml.SourceGeneration.Tests.csproj test/Styml.SourceGeneration.Unit.Tests/Styml.SourceGeneration.Unit.Tests.csproj test/Styml.Yaml.Tests/Styml.Yaml.Tests.csproj test/Styml.Parity.Tests/Styml.Parity.Tests.csproj
    - name: Test, leg YJ (net11.0)
      shell: bash
      env:
        STYML_BUILD_ARGS: -p:VersionSuffix=preview.${{ github.run_number }} -p:ContinuousIntegrationBuild=True
        STYML_TEST_WRITER: json
      run: eng/test/run-tests.sh net11.0 test/Styml.Tests/Styml.Tests.csproj test/Styml.SourceGeneration.Tests/Styml.SourceGeneration.Tests.csproj test/Styml.SourceGeneration.Unit.Tests/Styml.SourceGeneration.Unit.Tests.csproj test/Styml.Yaml.Tests/Styml.Yaml.Tests.csproj test/Styml.Parity.Tests/Styml.Parity.Tests.csproj
    # The .NET Framework runtime, bound to the netstandard2.0 asset.
    - name: Test, leg Y (net481)
      if: runner.os == 'Windows'
      shell: bash
      env:
        STYML_BUILD_ARGS: -p:VersionSuffix=preview.${{ github.run_number }} -p:ContinuousIntegrationBuild=True
      run: eng/test/run-tests.sh net481 test/Styml.Yaml.Tests/Styml.Yaml.Tests.csproj
    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: testresults-${{ matrix.os }}
        path: |
          artifacts/testresults/
          artifacts/testresults-yj/
        if-no-files-found: ignore
        retention-days: 7

    # Pack on every run so a missing target asset fails the pull request, not only main or a release tag.
    - name: Pack preview packages
      if: matrix.os == 'ubuntu-latest'
      run: dotnet pack src/Styml/Styml.csproj --output artifacts/packages --configuration Release --no-build -p:VersionSuffix=preview.${{ github.run_number }} -p:ContinuousIntegrationBuild=True

    # The consumer sample, restored from the packed package as a consumer would.
    - name: Consumer sample from the package
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        set -euo pipefail
        version="$(dotnet msbuild src/Styml/Styml.csproj -getProperty:PackageVersion -p:VersionSuffix=preview.${{ github.run_number }})"
        # The sample's project adds artifacts/packages to the restore sources.
        dotnet restore samples/RoundTrip $RESTORE_SOURCES -p:NoWarn=NU1507 -p:StymlPackageVersion="$version"
        for tfm in net11.0 net10.0; do
          dotnet run --project samples/RoundTrip -c Release -f "$tfm" --no-restore -p:StymlPackageVersion="$version"
        done

    - name: Push preview packages to Feedz
      if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest'
      shell: bash
      env:
        FEEDZ_IO_API_KEY: ${{ secrets.FEEDZ_IO_API_KEY }}
      run: |
        set -euo pipefail
        if [[ -z "$FEEDZ_IO_API_KEY" ]]; then
          echo "Feedz publishing skipped: FEEDZ_IO_API_KEY is not configured."
          exit 0
        fi
        for package in artifacts/packages/*.nupkg; do
          dotnet nuget push "$package" --api-key "$FEEDZ_IO_API_KEY" --source https://f.feedz.io/sebastienros/styml/nuget/index.json --skip-duplicate
        done
