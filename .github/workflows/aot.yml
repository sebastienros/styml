name: NativeAOT and Trimming Qualification

permissions:
  contents: read

# Off the PR and main paths: publishing NativeAOT consumers is slow, and the library has
# no OS-specific AOT code. One Linux job gates each release (publish.yml), or runs on demand.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  aot:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: |
            10.0.x
          global-json-file: global.json
          check-latest: false

      # samples/AotSmoke: a source-generated round trip, the DOM and the reader, with reflection off by the feature
      # switch; trim and AOT warnings are errors (set in the project), and the app exits non-zero on a failed check.
      - name: Publish and run the trimmed smoke app
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish samples/AotSmoke/AotSmoke.csproj -c Release -r linux-x64 -p:SmokeMode=Trim -o artifacts/trim-smoke
          ./artifacts/trim-smoke/AotSmoke

      - name: Publish and run the NativeAOT smoke app
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish samples/AotSmoke/AotSmoke.csproj -c Release -r linux-x64 -p:SmokeMode=Aot -o artifacts/aot-smoke
          ./artifacts/aot-smoke/AotSmoke
