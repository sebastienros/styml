<svg xmlns="http://www.w3.org/2000/svg" width="1051" height="452" viewBox="0 0 1051 452" role="img" aria-labelledby="title desc">
  <title id="title">DOM parse, Kubernetes manifests, k8s-m, 76 KB</title>
  <desc id="desc">DOM parse of Kubernetes manifests, k8s-m, 76 KB: Styml takes 259.4 µs and allocates 72 B; Styml YamlNode 1.58 times Styml's time (409.4 µs) and 815.9 KB; SharpYaml 4.81 times Styml's time (1,248.0 µs) and 1.83 MB; YamlDotNet 6.79 times Styml's time (1,760.4 µs) and 2.75 MB; JsonDocument (JSON) 0.61 times Styml's time (158.3 µs) and 72 B; JsonNode (JSON) 1.33 times Styml's time (344.5 µs) and 809.5 KB. Smaller is better.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #3f3f46; }
      .tick { font-size: 11px; fill: #666; }
      .axis-title { font-size: 13px; font-weight: 600; }
      .heading { font-size: 13px; font-weight: 600; fill: #3f3f46; }
      .caption { font-size: 11.5px; fill: #555; }
      .grid { stroke: #dedede; stroke-width: 1; }
      .axis { stroke: #8c8c8c; stroke-width: 1; }
      .value { font-size: 11px; text-anchor: middle; fill: #555; }
      .styml-value { font-size: 11px; font-weight: 700; text-anchor: middle; fill: #312e81; }
      .competitor { opacity: .72; }
    </style>
  </defs>
  <rect width="1051" height="452" fill="#fff"/>

  <g font-size="12">
    <circle cx="126" cy="23" r="5" fill="#4F46E5" stroke="#312e81" stroke-width="2"/>
    <text x="137" y="27" font-weight="700">Styml YamlDocument</text>
    <circle cx="296" cy="23" r="5" fill="#A5B4FC" stroke="#312e81" stroke-width="2"/>
    <text x="307" y="27" font-weight="700">Styml YamlNode</text>
    <circle cx="439" cy="23" r="5" fill="#009E73" opacity=".8"/>
    <text x="450" y="27">SharpYaml</text>
    <circle cx="544" cy="23" r="5" fill="#D55E00" opacity=".8"/>
    <text x="555" y="27">YamlDotNet</text>
    <circle cx="655" cy="23" r="5" fill="#9CA3AF" opacity=".8"/>
    <text x="666" y="27">JsonDocument (JSON)</text>
    <circle cx="825" cy="23" r="5" fill="#D1D5DB" opacity=".8"/>
    <text x="836" y="27">JsonNode (JSON)</text>
  </g>
  <text class="heading" x="525.5" y="59" text-anchor="middle">DOM parse · Kubernetes manifests, k8s-m, 76 KB · smaller is better ↓</text>

  <g>
    <line class="grid" x1="62" y1="342" x2="500" y2="342"/><text class="tick" x="52" y="346" text-anchor="end">0</text>
    <line class="grid" x1="62" y1="290.4" x2="500" y2="290.4"/><text class="tick" x="52" y="294.4" text-anchor="end">400</text>
    <line class="grid" x1="62" y1="238.8" x2="500" y2="238.8"/><text class="tick" x="52" y="242.8" text-anchor="end">800</text>
    <line class="grid" x1="62" y1="187.2" x2="500" y2="187.2"/><text class="tick" x="52" y="191.2" text-anchor="end">1,200</text>
    <line class="grid" x1="62" y1="135.6" x2="500" y2="135.6"/><text class="tick" x="52" y="139.6" text-anchor="end">1,600</text>
    <line class="grid" x1="62" y1="84" x2="500" y2="84"/><text class="tick" x="52" y="88" text-anchor="end">2,000</text>
    <line class="axis" x1="62" y1="84" x2="62" y2="342"/><line class="axis" x1="62" y1="342" x2="500" y2="342"/>

    <rect x="88" y="308.5" width="46.7" height="33.5" rx="1" fill="#4F46E5" stroke="#312e81" stroke-width="2"/>
    <text class="styml-value" x="111.3" y="302">259.4</text>
    <rect x="156.1" y="289.2" width="46.7" height="52.8" rx="1" fill="#A5B4FC" stroke="#312e81" stroke-width="2"/>
    <text class="styml-value" x="179.4" y="282">409.4</text>
    <rect class="competitor" x="224.2" y="181" width="46.7" height="161" rx="1" fill="#009E73"/>
    <text class="value" x="247.5" y="174">1,248.0</text>
    <rect class="competitor" x="292.3" y="114.9" width="46.7" height="227.1" rx="1" fill="#D55E00"/>
    <text class="value" x="315.7" y="108">1,760.4</text>
    <rect class="competitor" x="360.4" y="321.6" width="46.7" height="20.4" rx="1" fill="#9CA3AF"/>
    <text class="value" x="383.8" y="315">158.3</text>
    <rect class="competitor" x="428.5" y="297.6" width="46.7" height="44.4" rx="1" fill="#D1D5DB"/>
    <text class="value" x="451.9" y="291">344.5</text>
    <text class="axis-title" x="281" y="381" text-anchor="middle">Duration (microseconds)</text>
  </g>

  <g>
    <line class="grid" x1="588" y1="342" x2="1026" y2="342"/><text class="tick" x="578" y="346" text-anchor="end">0</text>
    <line class="grid" x1="588" y1="290.4" x2="1026" y2="290.4"/><text class="tick" x="578" y="294.4" text-anchor="end">1,000</text>
    <line class="grid" x1="588" y1="238.8" x2="1026" y2="238.8"/><text class="tick" x="578" y="242.8" text-anchor="end">2,000</text>
    <line class="grid" x1="588" y1="187.2" x2="1026" y2="187.2"/><text class="tick" x="578" y="191.2" text-anchor="end">3,000</text>
    <line class="grid" x1="588" y1="135.6" x2="1026" y2="135.6"/><text class="tick" x="578" y="139.6" text-anchor="end">4,000</text>
    <line class="grid" x1="588" y1="84" x2="1026" y2="84"/><text class="tick" x="578" y="88" text-anchor="end">5,000</text>
    <line class="axis" x1="588" y1="84" x2="588" y2="342"/><line class="axis" x1="588" y1="342" x2="1026" y2="342"/>

    <rect x="614" y="342" width="46.7" height="1.5" rx="1" fill="#4F46E5" stroke="#312e81" stroke-width="2"/>
    <text class="styml-value" x="637.4" y="335">72 B</text>
    <rect x="682.1" y="299.9" width="46.7" height="42.1" rx="1" fill="#A5B4FC" stroke="#312e81" stroke-width="2"/>
    <text class="styml-value" x="705.5" y="293">815.9 KB</text>
    <rect class="competitor" x="750.2" y="245.1" width="46.7" height="96.9" rx="1" fill="#009E73"/>
    <text class="value" x="773.6" y="238">1.83 MB</text>
    <rect class="competitor" x="818.3" y="196.8" width="46.7" height="145.2" rx="1" fill="#D55E00"/>
    <text class="value" x="841.6" y="190">2.75 MB</text>
    <rect class="competitor" x="886.4" y="342" width="46.7" height="1" rx="1" fill="#9CA3AF"/>
    <text class="value" x="909.8" y="335">72 B</text>
    <rect class="competitor" x="954.5" y="300.2" width="46.7" height="41.8" rx="1" fill="#D1D5DB"/>
    <text class="value" x="977.9" y="293">809.5 KB</text>
    <text class="axis-title" x="807" y="381" text-anchor="middle">Memory allocation (kilobytes)</text>
  </g>

  <text class="caption" x="525.5" y="412" text-anchor="middle">VYaml has no DOM. YamlDocument and JsonDocument rent their storage from the array pool and return it on dispose;</text>
  <text class="caption" x="525.5" y="428" text-anchor="middle">YamlNode and JsonNode are the mutable models. YamlDotNet and SharpYaml build their YamlStream.</text>
</svg>
