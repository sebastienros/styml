<svg xmlns="http://www.w3.org/2000/svg" width="1051" height="452" viewBox="0 0 1051 452" role="img" aria-labelledby="title desc">
  <title id="title">Tokenize (the reader alone), Kubernetes manifests, k8s-m, 76 KB</title>
  <desc id="desc">Tokenize (the reader alone) of Kubernetes manifests, k8s-m, 76 KB: Styml takes 189.7 µs and allocates 0 B; VYaml 1.63 times Styml's time (309.0 µs) and 1.1 KB; SharpYaml 4.70 times Styml's time (891.0 µs) and 1.26 MB; YamlDotNet 7.17 times Styml's time (1,360.2 µs) and 1.78 MB; System.Text.Json (JSON) 0.63 times Styml's time (119.1 µs) and 0 B. Smaller is better.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #3f3f46; }
      .tick { font-size: 11px; fill: #666; }
      .axis-title { font-size: 13px; font-weight: 600; }
      .heading { font-size: 13px; font-weight: 600; fill: #3f3f46; }
      .caption { font-size: 11.5px; fill: #555; }
      .grid { stroke: #dedede; stroke-width: 1; }
      .axis { stroke: #8c8c8c; stroke-width: 1; }
      .value { font-size: 11px; text-anchor: middle; fill: #555; }
      .styml-value { font-size: 11px; font-weight: 700; text-anchor: middle; fill: #312e81; }
      .competitor { opacity: .72; }
    </style>
  </defs>
  <rect width="1051" height="452" fill="#fff"/>

  <g font-size="12">
    <circle cx="260" cy="23" r="5" fill="#4F46E5" stroke="#312e81" stroke-width="2"/>
    <text x="271" y="27" font-weight="700">Styml</text>
    <circle cx="344" cy="23" r="5" fill="#E69F00" opacity=".8"/>
    <text x="355" y="27">VYaml</text>
    <circle cx="422" cy="23" r="5" fill="#009E73" opacity=".8"/>
    <text x="433" y="27">SharpYaml</text>
    <circle cx="527" cy="23" r="5" fill="#D55E00" opacity=".8"/>
    <text x="538" y="27">YamlDotNet</text>
    <circle cx="638" cy="23" r="5" fill="#9CA3AF" opacity=".8"/>
    <text x="649" y="27">System.Text.Json (JSON)</text>
  </g>
  <text class="heading" x="525.5" y="59" text-anchor="middle">Tokenize (the reader alone) · Kubernetes manifests, k8s-m, 76 KB · smaller is better ↓</text>

  <g>
    <line class="grid" x1="62" y1="342" x2="500" y2="342"/><text class="tick" x="52" y="346" text-anchor="end">0</text>
    <line class="grid" x1="62" y1="290.4" x2="500" y2="290.4"/><text class="tick" x="52" y="294.4" text-anchor="end">400</text>
