    <line class="grid" x1="588" y1="213" x2="1026" y2="213"/><text class="tick" x="578" y="217" text-anchor="end">100</text>
    <line class="grid" x1="588" y1="148.5" x2="1026" y2="148.5"/><text class="tick" x="578" y="152.5" text-anchor="end">1,000</text>
    <line class="grid" x1="588" y1="84" x2="1026" y2="84"/><text class="tick" x="578" y="88" text-anchor="end">10,000</text>
    <line class="axis" x1="588" y1="84" x2="588" y2="342"/><line class="axis" x1="588" y1="342" x2="1026" y2="342"/>

    <rect x="614" y="221.8" width="46.7" height="120.2" rx="1" fill="#4F46E5" stroke="#312e81" stroke-width="2"/>
    <text class="styml-value" x="637.4" y="215">73.1 KB</text>
    <rect x="682.1" y="342" width="46.7" height="1.5" rx="1" fill="#A5B4FC" stroke="#312e81" stroke-width="2"/>
    <text class="styml-value" x="705.5" y="335">0 B</text>
    <rect class="competitor" x="750.2" y="291.1" width="46.7" height="50.9" rx="1" fill="#E69F00"/>
    <text class="value" x="773.6" y="284">6.2 KB</text>
    <rect class="competitor" x="818.3" y="251.5" width="46.7" height="90.5" rx="1" fill="#009E73"/>
    <text class="value" x="841.6" y="244">25.3 KB</text>
    <rect class="competitor" x="886.4" y="127.6" width="46.7" height="214.4" rx="1" fill="#D55E00"/>
    <text class="value" x="909.8" y="121">2.06 MB</text>
    <rect class="competitor" x="954.5" y="229.7" width="46.7" height="112.3" rx="1" fill="#9CA3AF"/>
    <text class="value" x="977.9" y="223">55.0 KB</text>
    <text class="axis-title" x="807" y="381" text-anchor="middle">Memory allocation (kilobytes) · logarithmic scale</text>
  </g>

  <text class="caption" x="525.5" y="412" text-anchor="middle">Styml's first bar returns a new byte[]; its reused-buffer bar writes into a reused writer and buffer, as SharpYaml's</text>
  <text class="caption" x="525.5" y="428" text-anchor="middle">and VYaml's rows do (SharpYaml's buffer is UTF-16). YamlDotNet returns a string. System.Text.Json writes JSON.</text>
</svg>
