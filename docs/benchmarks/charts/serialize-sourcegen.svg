<svg xmlns="http://www.w3.org/2000/svg" width="1051" height="452" viewBox="0 0 1051 452" role="img" aria-labelledby="title desc">
  <title id="title">Serialize, source-generated, Kubernetes manifests, k8s-m, 76 KB</title>
  <desc id="desc">Serialize, source-generated of Kubernetes manifests, k8s-m, 76 KB: Styml takes 53.7 µs and allocates 73.1 KB; Styml, reused buffer 0.95 times Styml's time (50.8 µs) and 0 B; VYaml 1.87 times Styml's time (100.2 µs) and 6.2 KB; SharpYaml 3.40 times Styml's time (182.4 µs) and 25.3 KB; YamlDotNet 34.15 times Styml's time (1,832.3 µs) and 2.06 MB; System.Text.Json (JSON) 0.74 times Styml's time (39.5 µs) and 55.0 KB. Smaller is better.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #3f3f46; }
      .tick { font-size: 11px; fill: #666; }
      .axis-title { font-size: 13px; font-weight: 600; }
      .heading { font-size: 13px; font-weight: 600; fill: #3f3f46; }
      .caption { font-size: 11.5px; fill: #555; }
      .grid { stroke: #dedede; stroke-width: 1; }
      .axis { stroke: #8c8c8c; stroke-width: 1; }
      .value { font-size: 11px; text-anchor: middle; fill: #555; }
      .styml-value { font-size: 11px; font-weight: 700; text-anchor: middle; fill: #312e81; }
      .competitor { opacity: .72; }
    </style>
  </defs>
  <rect width="1051" height="452" fill="#fff"/>

  <g font-size="12">
    <circle cx="169" cy="23" r="5" fill="#4F46E5" stroke="#312e81" stroke-width="2"/>
    <text x="180" y="27" font-weight="700">Styml</text>
    <circle cx="253" cy="23" r="5" fill="#A5B4FC" stroke="#312e81" stroke-width="2"/>
    <text x="264" y="27" font-weight="700">Styml, reused buffer</text>
    <circle cx="436" cy="23" r="5" fill="#E69F00" opacity=".8"/>
    <text x="447" y="27">VYaml</text>
    <circle cx="514" cy="23" r="5" fill="#009E73" opacity=".8"/>
    <text x="525" y="27">SharpYaml</text>
    <circle cx="618" cy="23" r="5" fill="#D55E00" opacity=".8"/>
    <text x="629" y="27">YamlDotNet</text>
    <circle cx="729" cy="23" r="5" fill="#9CA3AF" opacity=".8"/>
    <text x="740" y="27">System.Text.Json (JSON)</text>
  </g>
  <text class="heading" x="525.5" y="59" text-anchor="middle">Serialize, source-generated · Kubernetes manifests, k8s-m, 76 KB · smaller is better ↓</text>

  <g>
    <line class="grid" x1="62" y1="342" x2="500" y2="342"/><text class="tick" x="52" y="346" text-anchor="end">10</text>
    <line class="grid" x1="62" y1="256" x2="500" y2="256"/><text class="tick" x="52" y="260" text-anchor="end">100</text>
    <line class="grid" x1="62" y1="170" x2="500" y2="170"/><text class="tick" x="52" y="174" text-anchor="end">1,000</text>
    <line class="grid" x1="62" y1="84" x2="500" y2="84"/><text class="tick" x="52" y="88" text-anchor="end">10,000</text>
    <line class="axis" x1="62" y1="84" x2="62" y2="342"/><line class="axis" x1="62" y1="342" x2="500" y2="342"/>

    <rect x="88" y="279.3" width="46.7" height="62.7" rx="1" fill="#4F46E5" stroke="#312e81" stroke-width="2"/>
    <text class="styml-value" x="111.3" y="272">53.7</text>
    <rect x="156.1" y="281.3" width="46.7" height="60.7" rx="1" fill="#A5B4FC" stroke="#312e81" stroke-width="2"/>
    <text class="styml-value" x="179.4" y="274">50.8</text>
    <rect class="competitor" x="224.2" y="255.9" width="46.7" height="86.1" rx="1" fill="#E69F00"/>
    <text class="value" x="247.5" y="249">100.2</text>
    <rect class="competitor" x="292.3" y="233.5" width="46.7" height="108.5" rx="1" fill="#009E73"/>
    <text class="value" x="315.7" y="227">182.4</text>
    <rect class="competitor" x="360.4" y="147.4" width="46.7" height="194.6" rx="1" fill="#D55E00"/>
    <text class="value" x="383.8" y="140">1,832.3</text>
    <rect class="competitor" x="428.5" y="290.7" width="46.7" height="51.3" rx="1" fill="#9CA3AF"/>
    <text class="value" x="451.9" y="284">39.5</text>
    <text class="axis-title" x="281" y="381" text-anchor="middle">Duration (microseconds) · logarithmic scale</text>
  </g>

  <g>
    <line class="grid" x1="588" y1="342" x2="1026" y2="342"/><text class="tick" x="578" y="346" text-anchor="end">1</text>
