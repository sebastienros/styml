    <text x="499" y="27">YamlDotNet</text>
    <circle cx="599" cy="23" r="5" fill="#9CA3AF" opacity=".8"/>
    <text x="610" y="27">System.Text.Json (JSON)</text>
  </g>
  <text class="heading" x="525.5" y="59" text-anchor="middle">Deserialize, reflection · Kubernetes manifests, k8s-m, 76 KB · smaller is better ↓</text>

